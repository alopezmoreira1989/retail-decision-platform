[project]
name = "retail-decision-platform"
version = "0.1.0"
description = "Synthetic-data retail decision intelligence platform: simulation, data platform, analytics, and recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "evaluation: offline experiments comparing against hidden simulator ground truth (not a correctness gate)",
]

[tool.setuptools.packages.find]
# The repo root also holds empty scaffold directories for future
# milestones (app/, config/, data_quality/, feedback/, infrastructure/,
# ingestion/, models/, orchestration/, recommendations/,
# transformations/ -- each just a placeholder README.md). Without this,
# setuptools' flat-layout auto-discovery treats every one of them as a
# candidate top-level package and refuses to build. Only `simulator`
# (and its subpackages) is actual installable code.
include = ["simulator*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
